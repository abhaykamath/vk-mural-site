# Netlify build settings for the showcase site.
#
# Only `site/` is deployed. The studio tool in `studio/` is a separate build and
# is deliberately not published here.

# Paths here are relative to this file, which already lives in site/. Setting
# `base = "site"` would resolve to site/site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Astro writes real directories, for example /ml/index.html, so Netlify serves
# them without any redirect rules. The only thing worth adding is a 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# The paintings and fonts never change once published, so they can be cached
# hard. The HTML must not be, or a redeploy would not reach anyone.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sensible defaults for a site that loads nothing from anywhere else.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
